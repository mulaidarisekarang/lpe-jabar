
name: Update data BPS

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl requests

      - run: python scripts/update_from_bps.py
        env:
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}

      - run: |
          git config user.name "bps-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data BPS" && git push)
